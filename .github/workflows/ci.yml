name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  # The release archives of the lock CLI (scripts/release-cli.sh), as the
  # release workflow builds them, without signing: layout, version, and
  # reproducibility (two builds, same checksums).
  cli-archives:
    name: cli archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: build twice
        run: |
          sh scripts/release-cli.sh 0.0.0-ci a
          sh scripts/release-cli.sh 0.0.0-ci b
          cmp a/checksums.txt b/checksums.txt
          test "$(wc -l <a/checksums.txt)" = 4
          (cd a && sha256sum -c checksums.txt)
          test "$(tar -tzf a/lock_0.0.0-ci_linux_amd64.tar.gz | sort | tr '\n' ' ')" = "LICENSE lock "
          tar -xzf a/lock_0.0.0-ci_linux_amd64.tar.gz -C a lock
          test "$(a/lock version)" = "lock 0.0.0-ci"

  image:
    name: image (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build
        run: docker build --build-arg VERSION=ci -t lockhub:ci .
      - name: smoke
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges lockhub:ci version
          docker run --rm --read-only --cap-drop ALL --entrypoint lock lockhub:ci version
