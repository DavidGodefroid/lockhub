name: e2e-lox-up

# The hub plan's exit demos, end to end, with real images and Docker:
# phase 1 (locksql's TestHubPhase1 against this lockhub), phase 2 (lox up
# stack, tickets approved through the facade socket, a host agent's
# `locksql mcp` and `lockmq mcp` through up.json, I2, I11) and
# phase 5 (install.sh, lox add, lox up, lox import), and the first run
# (ci/e2e/firstrun.sh: lox init, lox add locksql with ask and with Vault,
# lox remove), and lockfile under its shipped seccomp profile
# (ci/e2e/seccomp.sh), and locklog's mount plan, containers map and lox
# refresh (ci/e2e/locklog.sh), and a host agent's `locklog mcp`
# (ci/e2e/locklog-agent.sh), and a host agent's `lockssh mcp` against an
# SSH server (ci/e2e/lockssh-agent.sh), and lox add lockfile against an
# SFTP server (ci/e2e/lockfile-sftp.sh), and two workspaces sharing the
# facade socket (ci/e2e/two-workspaces.sh), and the company's managed file
# (ci/e2e/managed.sh). Phases 2 and 5, the first run,
# the seccomp, the two workspaces and the locklog checks run this commit's hub image (ci/e2e/local-hub.sh), not the latest release
# that lox add pins. The upgrade (ci/e2e/upgrade.sh) runs released hubs:
# lox run upgrading a workspace on the previous releases to the ones this
# lox ships with; ci/e2e/upgrade-running.sh, this lox over a stack a
# released lox made and left up (lockhub#199).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  GOMAXPROCS: "2"

jobs:
  phase1:
    name: e2e phase 1 (locksql TestHubPhase1)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: lockhub
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DavidGodefroid/locksql
          path: locksql
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: unprivileged user namespaces (the test hides /etc/locksql with unshare)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: docker pull --quiet postgres:17
      - name: TestHubPhase1
        working-directory: locksql
        env:
          LOCKHUB_E2E: "1"
          LOCKHUB_SRC: ${{ github.workspace }}/lockhub
        run: |
          set -o pipefail
          go test -tags integration -count=1 -timeout 20m -run '^TestHubPhase1$' -v ./test/integration | tee phase1.out
          if grep -q -- '--- SKIP' phase1.out; then echo "a subtest skipped"; exit 1; fi
          grep -q '^--- PASS: TestHubPhase1 ' phase1.out

  phase2:
    name: e2e phase 2 (lox up with locksql, lockmq and LockHTTP, facade approvals, host agents, I2, I11)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # locksql's host launcher (scripts/locksql), for the host agent
      # (`locksql mcp`, lockhub#78): its v0.17.0 release commit, which
      # ships the up.json reading (DavidGodefroid/locksql#153) and matches
      # the image lox add pins (the latest release, v0.17.0).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DavidGodefroid/locksql
          ref: 8cc3eac669a2eaea569cb11acd4b5b584b16ad21 # v0.17.0
          path: locksql-launcher
      # lockmq's host launcher (scripts/lockmq), for the host agent
      # (`lockmq mcp`, lockhub#78): its v0.8.0 release commit, which
      # ships the up.json reading (DavidGodefroid/lockmq#36) and matches
      # the image lox add pins (the latest release, v0.8.0).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DavidGodefroid/lockmq
          ref: 2a02e7cbe3a5b11d17525ab3eeb14fcc0ecaf4f8 # v0.8.0
          path: lockmq-launcher
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.1
      - run: go build -o "$RUNNER_TEMP/bin/lox" ./cmd/lox
      - name: this commit's hub image (containerd image store, cosign shim)
        run: sh ci/e2e/ci-hub.sh "$RUNNER_TEMP/shim"
      # Started after the image store switch (a service container would
      # not survive the Docker restart).
      - name: Postgres for the locksql lock
        run: |
          docker run -d --name "e2e-pg-${{ github.run_id }}" -p 5432:5432 -e POSTGRES_PASSWORD=e2e-only postgres:17 >/dev/null
          for i in $(seq 1 60); do docker exec "e2e-pg-${{ github.run_id }}" pg_isready -h 127.0.0.1 -U postgres -q && break; sleep 1; done
          docker exec "e2e-pg-${{ github.run_id }}" pg_isready -h 127.0.0.1 -U postgres
      # Not a service container either, for the same reason. The minor
      # lockmq's own CI runs (4.1), at an exact patch release.
      - name: RabbitMQ for the lockmq lock
        run: |
          docker run -d --name "e2e-mq-${{ github.run_id }}" -p 15672:15672 -p 5672:5672 \
            -e RABBITMQ_DEFAULT_USER=admin -e RABBITMQ_DEFAULT_PASS=e2e-admin-only rabbitmq:4.1.8-management >/dev/null
          for i in $(seq 1 90); do curl -fsS -m 5 -u admin:e2e-admin-only http://127.0.0.1:15672/api/overview >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS -m 5 -u admin:e2e-admin-only http://127.0.0.1:15672/api/overview >/dev/null
      - name: phase 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          E2E_ID: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGPASSWORD: e2e-only
          LOCKS: db:locksql web:lockhttp api:lockhttp mq:lockmq
          MQ_ADMIN_USER: admin
          MQ_ADMIN_PASSWORD: e2e-admin-only
        run: |
          export XDG_STATE_HOME="$RUNNER_TEMP/state" XDG_RUNTIME_DIR="$RUNNER_TEMP/run"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          export LOCKSQL_LAUNCHER="$GITHUB_WORKSPACE/locksql-launcher/scripts/locksql"
          export LOCKMQ_LAUNCHER="$GITHUB_WORKSPACE/lockmq-launcher/scripts/lockmq"
          sh ci/e2e/phase2.sh "$RUNNER_TEMP/bin/lox"

  first-run:
    name: e2e first run (lox init, lox add locksql ask and vault, lox remove)
    runs-on: ubuntu-24.04
    # The job runs the flow twice: without and with the Vault half.
    timeout-minutes: 45
    env:
      # The Vault dev server of the lock with credentials = vault, at an
      # exact patch tag pinned by its multi-platform index digest.
      E2E_VAULT_IMAGE: hashicorp/vault:2.2.1@sha256:962a92876e168d68eaaa24b0b8b49bbce1cb63024060a67bba95cd158a366fc2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The launcher lox add drives (profile add, init claude, doctor, then
      # the host agents' mcp): the v0.17.0 release (v0.13.1 or later: its
      # profile add takes --credentials ask|vault --vault-path and its
      # console asks the Vault token at its start). The job this one
      # replaces pinned a commit on main for that (DavidGodefroid/locksql#164)
      # until the tag existed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DavidGodefroid/locksql
          ref: v0.17.0
          path: locksql-launcher
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.1
      - run: go build -o "$RUNNER_TEMP/bin/lox" ./cmd/lox
      - name: this commit's hub image (containerd image store, cosign shim)
        run: sh ci/e2e/ci-hub.sh "$RUNNER_TEMP/shim"
      # Not a service container, for the same reason as phase 2's
      # databases: it would not survive the Docker restart of the image
      # store switch. In dev mode the server is unsealed and answers on
      # 8200 (published as 58200). The root token is a throwaway, generated
      # here and handed to the next steps through the environment; it
      # reaches no file the e2e greps (the workspace but .env, lox up's
      # state directory).
      - name: Vault dev server (for the lock with credentials = vault)
        run: |
          token="e2e-$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          docker run -d --name "e2e-vault-${{ github.run_id }}" -p 58200:8200 \
            -e VAULT_DEV_ROOT_TOKEN_ID="$token" \
            "$E2E_VAULT_IMAGE" server -dev -dev-listen-address 0.0.0.0:8200 >/dev/null
          {
            echo "E2E_VAULT_CONTAINER=e2e-vault-${{ github.run_id }}"
            echo "E2E_VAULT_TOKEN=$token"
          } >>"$GITHUB_ENV"
          for i in $(seq 1 30); do docker exec -e VAULT_ADDR=http://127.0.0.1:8200 "e2e-vault-${{ github.run_id }}" vault status >/dev/null 2>&1 && break; sleep 1; done
          docker exec -e VAULT_ADDR=http://127.0.0.1:8200 "e2e-vault-${{ github.run_id }}" vault status >/dev/null
      - name: first run (lox init, lox add locksql, lox remove)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          E2E_ID: e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          export XDG_STATE_HOME="$RUNNER_TEMP/state" XDG_RUNTIME_DIR="$RUNNER_TEMP/run"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          export LOCKSQL_LAUNCHER="$GITHUB_WORKSPACE/locksql-launcher/scripts/locksql"
          sh ci/e2e/firstrun.sh "$RUNNER_TEMP/bin/lox"
      # The Vault half of the first run: one ask lock and one vault lock in
      # the same workspace, both queries approved. Its console's
      # Vault-token prompt is released (locksql v0.13.1; v0.17.0 is checked out above).
      - name: first run (lox add locksql with Vault)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          E2E_ID: e2e-vault-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          export XDG_STATE_HOME="$RUNNER_TEMP/state-vault" XDG_RUNTIME_DIR="$RUNNER_TEMP/run-vault"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          export LOCKSQL_LAUNCHER="$GITHUB_WORKSPACE/locksql-launcher/scripts/locksql"
          E2E_VAULT=1 sh ci/e2e/firstrun.sh "$RUNNER_TEMP/bin/lox"

  # lockfile's console under lockfile's shipped seccomp profile (#45):
  # docker inspect shows exactly that profile, the console's process runs
  # under a filter, and lockfile's doctor says the sandbox works under it.
  lockfile-seccomp:
    name: e2e lockfile seccomp (lox up runs lockfile under its shipped profile)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      # cosign v2, as distributions ship it: lockfile's releases sign their
      # images in the bundle format (cosign v3), which lox then verifies
      # with --new-bundle-format (lockhub#197); the jobs below keep v3.
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.1
      - run: go build -o "$RUNNER_TEMP/bin/lox" ./cmd/lox
      - name: this commit's hub image (containerd image store, cosign shim)
        run: sh ci/e2e/ci-hub.sh "$RUNNER_TEMP/shim"
      - name: lockfile seccomp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          E2E_ID: e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          export XDG_STATE_HOME="$RUNNER_TEMP/state" XDG_RUNTIME_DIR="$RUNNER_TEMP/run"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          sh ci/e2e/seccomp.sh "$RUNNER_TEMP/bin/lox"

  # Two workspaces on one runner (#172): the second's lox run and lox up
  # refuse the first's hub on the shared facade socket, naming it; lox
  # doctor reports it; with its own XDG_RUNTIME_DIR, both hubs run.
  two-workspaces:
    name: e2e two workspaces (one facade socket, the second workspace refuses the first's hub)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      # cosign v3: lockfile's releases sign their images in its bundle
      # format (see lockfile-seccomp).
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - run: go build -o "$RUNNER_TEMP/bin/lox" ./cmd/lox
      - name: this commit's hub image (containerd image store, cosign shim)
        run: sh ci/e2e/ci-hub.sh "$RUNNER_TEMP/shim"
      - name: two workspaces
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          E2E_ID: e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          export XDG_STATE_HOME="$RUNNER_TEMP/state" XDG_RUNTIME_DIR="$RUNNER_TEMP/run"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          sh ci/e2e/two-workspaces.sh "$RUNNER_TEMP/bin/lox"

  # The company's managed file (lockhub#179): a root-owned
  # /etc/lockfamily/managed.toml (sudo), the released locksql and lockmq
  # lox add pins: a lock beyond the bounds or [lox] egress is not started,
  # the others are and read the file read-only; --no-upgrade refused.
  managed:
    name: e2e managed (lox run applies managed.toml, mounts it read-only, refuses a lock beyond it)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      # cosign v3: the locks' releases sign their images in its bundle
      # format (see lockfile-seccomp).
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - run: go build -o "$RUNNER_TEMP/bin/lox" ./cmd/lox
      - name: this commit's hub image (containerd image store, cosign shim)
        run: sh ci/e2e/ci-hub.sh "$RUNNER_TEMP/shim"
      - name: managed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          E2E_ID: e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          export XDG_STATE_HOME="$RUNNER_TEMP/state" XDG_RUNTIME_DIR="$RUNNER_TEMP/run"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          sh ci/e2e/managed.sh "$RUNNER_TEMP/bin/lox"

  locklog:
    name: e2e locklog mounts (lox run binds a locklog plan, the containers map, lox refresh, networks and routing)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      # cosign v3, as for lockfile: it verifies the locks' releases in
      # either signature format, and the hub's.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - run: go build -o "$RUNNER_TEMP/bin/lox" ./cmd/lox
      - name: this commit's hub image (containerd image store, cosign shim)
        run: sh ci/e2e/ci-hub.sh "$RUNNER_TEMP/shim"
      - name: locklog mounts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          E2E_ID: e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          export XDG_STATE_HOME="$RUNNER_TEMP/state" XDG_RUNTIME_DIR="$RUNNER_TEMP/run"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          sh ci/e2e/locklog.sh "$RUNNER_TEMP/bin/lox"

  # A host agent reaches a lox run locklog lock (lockhub#132): `locklog
  # init claude`'s .mcp.json, a masked count, then an unmask approved at
  # the terminal facade.
  locklog-agent:
    name: e2e locklog host agent (locklog mcp through up.json, a masked count, an approved unmask)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      # locklog's host launcher (scripts/locklog) at the release lox add
      # pins, read from ShippedLocks: the two cannot drift.
      - name: locklog's shipped release
        id: locklog
        run: |
          ref=$(go run ./ci/e2e/shipped locklog)
          echo "$ref" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "not a release tag: $ref" >&2; exit 1; }
          echo "ref=$ref" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DavidGodefroid/locklog
          ref: ${{ steps.locklog.outputs.ref }}
          path: locklog-launcher
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - run: go build -o "$RUNNER_TEMP/bin/lox" ./cmd/lox
      - name: this commit's hub image (containerd image store, cosign shim)
        run: sh ci/e2e/ci-hub.sh "$RUNNER_TEMP/shim"
      - name: locklog host agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          E2E_ID: e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          export XDG_STATE_HOME="$RUNNER_TEMP/state" XDG_RUNTIME_DIR="$RUNNER_TEMP/run"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          export LOCKLOG_LAUNCHER="$GITHUB_WORKSPACE/locklog-launcher/scripts/locklog"
          sh ci/e2e/locklog-agent.sh "$RUNNER_TEMP/bin/lox"

  # A host agent reaches a lox run lockssh lock (lockhub#133): an SSH
  # server in a container, `lockssh init claude`'s .mcp.json, a masked run
  # once the first connection is approved, then a command outside the
  # allow list approved at the terminal facade.
  lockssh-agent:
    name: e2e lockssh host agent (lockssh mcp through up.json, a masked run, an approved command)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      # lockssh's host launcher (scripts/lockssh) at the release lox add
      # pins, read from ShippedLocks: the two cannot drift.
      - name: lockssh's shipped release
        id: lockssh
        run: |
          ref=$(go run ./ci/e2e/shipped lockssh)
          echo "$ref" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "not a release tag: $ref" >&2; exit 1; }
          echo "ref=$ref" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DavidGodefroid/lockssh
          ref: ${{ steps.lockssh.outputs.ref }}
          path: lockssh-launcher
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - run: go build -o "$RUNNER_TEMP/bin/lox" ./cmd/lox
      - name: this commit's hub image (containerd image store, cosign shim)
        run: sh ci/e2e/ci-hub.sh "$RUNNER_TEMP/shim"
      - name: lockssh host agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          E2E_ID: e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          export XDG_STATE_HOME="$RUNNER_TEMP/state" XDG_RUNTIME_DIR="$RUNNER_TEMP/run"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          export LOCKSSH_LAUNCHER="$GITHUB_WORKSPACE/lockssh-launcher/scripts/lockssh"
          sh ci/e2e/lockssh-agent.sh "$RUNNER_TEMP/bin/lox"

  # lox add lockfile with an sftp source and a host known_hosts file
  # (lockhub#174): the copy in .lockfile/, the path the console sees, the
  # review's check, and the console connecting at its first start.
  lockfile-sftp:
    name: e2e lockfile sftp (lox add --known-hosts, the console connects)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      # lockfile's host binary (its profile add) at the release lox add
      # pins, read from ShippedLocks: the two cannot drift.
      - name: lockfile's shipped release
        run: |
          ref=$(go run ./ci/e2e/shipped lockfile)
          echo "$ref" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "not a release tag: $ref" >&2; exit 1; }
          GOBIN="$RUNNER_TEMP/lockfile-bin" go install "github.com/DavidGodefroid/lockfile/cmd/lockfile@$ref"
      # cosign v2, as lockfile-seccomp (lockhub#197).
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.1
      - run: go build -o "$RUNNER_TEMP/bin/lox" ./cmd/lox
      - name: this commit's hub image (containerd image store, cosign shim)
        run: sh ci/e2e/ci-hub.sh "$RUNNER_TEMP/shim"
      - name: lockfile sftp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          E2E_ID: e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          export XDG_STATE_HOME="$RUNNER_TEMP/state" XDG_RUNTIME_DIR="$RUNNER_TEMP/run"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          export LOCKFILE_BIN="$RUNNER_TEMP/lockfile-bin/lockfile"
          sh ci/e2e/lockfile-sftp.sh "$RUNNER_TEMP/bin/lox"

  phase5:
    name: e2e phase 5 (install.sh, lox add, lox up, lox import)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DavidGodefroid/lockfamily
          path: lockfamily
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.1
      - run: sh scripts/release-cli.sh 0.0.0-e2e "$RUNNER_TEMP/dist"
      - name: this commit's hub image (containerd image store, cosign shim)
        run: sh ci/e2e/ci-hub.sh "$RUNNER_TEMP/shim"
      - name: phase 5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          E2E_ID: e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          export XDG_STATE_HOME="$RUNNER_TEMP/state" XDG_RUNTIME_DIR="$RUNNER_TEMP/run"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          sh ci/e2e/phase5.sh lockfamily/install.sh "$RUNNER_TEMP/dist" 0.0.0-e2e

  upgrade:
    name: e2e upgrade (lox run upgrades the hub and a lock to its releases, cosign-verified, fail closed)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.1
      - name: upgrade
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export XDG_STATE_HOME="$RUNNER_TEMP/state" XDG_RUNTIME_DIR="$RUNNER_TEMP/run"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          sh ci/e2e/upgrade.sh "$RUNNER_TEMP/bin"

  # lockhub#199: this commit's lox run over a stack the released lox
  # v0.10.1 made and left up (its networks without subnets), then with its
  # hub exited (after a reboot); a Docker daemon restart starts nothing;
  # lox down.
  upgrade-running:
    name: e2e upgrade over a running stack (lox v0.10.1 → this commit, daemon restart, lox down)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.1
      - name: upgrade over a running stack
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          E2E_ID: e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          export XDG_STATE_HOME="$RUNNER_TEMP/state" XDG_RUNTIME_DIR="$RUNNER_TEMP/run"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          sh ci/e2e/upgrade-running.sh "$RUNNER_TEMP/bin" v0.10.1
